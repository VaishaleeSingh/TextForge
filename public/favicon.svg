    <rect x="-15" y="36" width="30" height="5" rx="2.5" fill="#0d6efd" opacity="0.6"/>
    <rect x="-18" y="44" width="36" height="5" rx="2.5" fill="#0d6efd" opacity="0.7"/>
  </g>
</svg>

